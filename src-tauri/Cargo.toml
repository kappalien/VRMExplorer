[package]
name = "vrm-explorer"
version = "1.5.0"
edition = "2021"
license = "MIT"
default-run = "vrm-explorer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "=2.8.1"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
semver = "1"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
