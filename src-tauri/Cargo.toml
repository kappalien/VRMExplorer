[package]
name = "vrm-explorer"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "=2.8.1"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
